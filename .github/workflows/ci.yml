name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Stub Supabase config so the production build (which prerenders the
    # auth-gated pages) and the e2e web server have the env vars they require.
    # These are not secrets: the real keys live on Vercel for production builds;
    # CI only needs the vars present so the config check doesn't throw.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Tenant-isolation (RLS) tests
        # Ubuntu runners ship PostgreSQL; run.sh finds the server binaries under
        # /usr/lib/postgresql/*/bin and stands up a disposable cluster.
        run: pnpm test:rls

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
